<svg viewBox="0 0 550 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="medEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="medAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="medRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="medShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="275" cy="210" r="180" fill="#ECFDF5" />
  <ellipse cx="410" cy="120" rx="60" ry="40" fill="#FEF3C7" opacity="0.7"/>
  <ellipse cx="120" cy="310" rx="50" ry="30" fill="#FCE7F3" opacity="0.6"/>

  <!-- Ground Plane -->
  <rect x="50" y="360" width="450" height="6" rx="3" fill="#E2E8F0"/>

  <!-- Central Mobile / Tablet Device Mockup -->
  <g filter="url(#medShadow)">
    <rect x="185" y="60" width="180" height="300" rx="28" fill="#1E293B"/>
    <rect x="193" y="70" width="164" height="280" rx="22" fill="#FFFFFF"/>
    <!-- Screen Notch -->
    <rect x="245" y="76" width="60" height="8" rx="4" fill="#0F172A"/>

    <!-- Screen Content: Doctor Profile Card -->
    <rect x="207" y="100" width="136" height="56" rx="14" fill="#F0FDF4"/>
    <circle cx="230" cy="128" r="16" fill="url(#medEmerald)"/>
    <path d="M226 128H234M230 124V132" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="254" y="118" width="70" height="8" rx="4" fill="#0F172A"/>
    <rect x="254" y="130" width="45" height="6" rx="3" fill="#10B981"/>

    <!-- Time Slots on Mobile -->
    <rect x="207" y="170" width="40" height="26" rx="8" fill="url(#medEmerald)"/>
    <text x="227" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF">09:00</text>

    <rect x="255" y="170" width="40" height="26" rx="8" fill="#F1F5F9"/>
    <text x="275" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#64748B">09:30</text>

    <rect x="303" y="170" width="40" height="26" rx="8" fill="#F1F5F9"/>
    <text x="323" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#64748B">10:00</text>

    <!-- Confirm Button on Mobile -->
    <rect x="207" y="210" width="136" height="34" rx="12" fill="url(#medAmber)"/>
    <text x="275" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" letter-spacing="0.5">RESERVAR CITA</text>

    <!-- Success Feedback Badge -->
    <rect x="207" y="258" width="136" height="74" rx="14" fill="#FAF5FF" stroke="#F3E8FF"/>
    <circle cx="275" cy="285" r="14" fill="#A855F7"/>
    <path d="M270 285L273 288L280 281" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="225" y="308" width="100" height="6" rx="3" fill="#C084FC"/>
  </g>

  <!-- Left Floating Shield: Seguridad & Confianza -->
  <g filter="url(#medShadow)">
    <rect x="70" y="140" width="85" height="85" rx="20" fill="#FFFFFF"/>
    <circle cx="112" cy="182" r="26" fill="url(#medEmerald)"/>
    <path d="M112 169L124 174V184C124 192 112 196 112 196C112 196 100 192 100 184V174L112 169Z" fill="#FFFFFF"/>
    <path d="M109 183L111 185L116 180" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Floating Heart Badge: Salud & Bienestar -->
  <g filter="url(#medShadow)">
    <rect x="395" y="180" width="90" height="90" rx="20" fill="#FFFFFF"/>
    <circle cx="440" cy="225" r="28" fill="url(#medRose)"/>
    <path d="M440 236C440 236 426 228 426 219C426 214.5 429.5 211 434 211C436.5 211 438.8 212.3 440 214C441.2 212.3 443.5 211 446 211C450.5 211 454 214.5 454 219C454 228 440 236 440 236Z" fill="#FFFFFF"/>
  </g>
</svg>

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: clinica-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: clinica_test
    ports:
      - "5432:5432"

  redis-test:
    image: redis:7-alpine
    container_name: clinica-redis-test
    ports:
      - "6379:6379"
